<style>
/* Layout: one phone-width column; header, scrolling screen, actions pinned to the thumb zone, tab bar.
   No web fonts and no third-party requests: system faces only (rounded on Apple devices). */
:root {
  --bg: #fbf6f7;
  --surface: #ffffff;
  --ink: #2b1b25;
  --muted: #6e5a66;
  --line: #eadde3;
  --blush: #c93b63;
  --blush-ink: #ffffff;
  --blush-soft: #f9dde5;
  --calm: #2a7a70;
  --calm-soft: #d7eeea;
  --sos: #b3261e;
  --sos-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(43, 27, 37, .06), 0 6px 20px rgba(43, 27, 37, .06);
  --display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17111a; --surface: #221a26; --ink: #f6ecf1; --muted: #b9a6b2; --line: #3a2e3f;
    --blush: #ff7a9c; --blush-ink: #2a0f19; --blush-soft: #4a2433; --calm: #6fd1c2; --calm-soft: #163a36;
    --sos: #ff8a80; --sos-soft: #4a1f1c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17111a; --surface: #221a26; --ink: #f6ecf1; --muted: #b9a6b2; --line: #3a2e3f;
  --blush: #ff7a9c; --blush-ink: #2a0f19; --blush-soft: #4a2433; --calm: #6fd1c2; --calm-soft: #163a36;
  --sos: #ff8a80; --sos-soft: #4a1f1c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--blush); font-weight: 600; }

#app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column;
  background: var(--bg);
}

/* Header */
.top {
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font: 700 20px/1 var(--display); letter-spacing: -.01em; flex: 1; }
.brand span { color: var(--blush); }
.chip-stat {
  font-size: 13px; font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sos-btn {
  min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0;
  background: var(--sos-soft); color: var(--sos); font-weight: 800; font-size: 13px; letter-spacing: .06em;
  cursor: pointer;
}

/* Screen */
main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px 0;
  display: flex; flex-direction: column;
}
.screen { display: flex; flex-direction: column; gap: 16px; flex: 1; padding-bottom: 8px; }
.screen > .grow { flex: 1; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font: 700 28px/1.15 var(--display); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
h2 { font: 700 20px/1.25 var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.lede { font-size: 17px; color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.card {
  background: var(--surface); border-radius: var(--r); padding: 18px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
}
.challenge-text { font: 600 22px/1.3 var(--display); letter-spacing: -.01em; text-wrap: pretty; }
.rule {
  border-radius: 14px; padding: 12px 14px; background: var(--blush-soft);
  font-weight: 600; font-size: 15px;
}
.note { border-radius: 14px; padding: 12px 14px; background: var(--calm-soft); font-size: 15px; }
.warn { border-radius: 14px; padding: 12px 14px; background: var(--sos-soft); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

/* Actions pinned at the bottom of the screen, in thumb reach */
.actions {
  position: sticky; bottom: 0; margin-top: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 14px 12px;
  background: linear-gradient(to bottom, transparent, var(--bg) 22%);
}
.btn {
  min-height: 54px; width: 100%; border-radius: 16px; border: 0; cursor: pointer;
  font: 700 17px/1.2 var(--body); padding: 0 18px;
  background: var(--blush); color: var(--blush-ink);
  transition: transform .08s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--muted); min-height: 44px; font-weight: 600; }
.btn.danger { background: var(--sos); color: var(--surface); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--blush); font-weight: 700; cursor: pointer; text-align: left; }

:focus-visible { outline: 3px solid var(--blush); outline-offset: 2px; }

/* Forms */
.q { display: flex; flex-direction: column; gap: 10px; }
.q-label { font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices.inline { flex-direction: row; flex-wrap: wrap; }
.choices.inline .choice { flex: 1 1 0; min-width: 0; justify-content: center; text-align: center; }
.choice {
  display: flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 10px 14px; border-radius: 14px;
  background: var(--surface); border: 1.5px solid var(--line);
  cursor: pointer; text-align: left; font-size: 15px; font-weight: 500;
}
.choice[aria-pressed="true"] { border-color: var(--blush); background: var(--blush-soft); font-weight: 700; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale.four { grid-template-columns: repeat(2, 1fr); }
.scale .choice { justify-content: center; text-align: center; font-size: 13px; padding: 8px 4px; min-height: 52px; line-height: 1.2; }

textarea {
  width: 100%; min-height: 84px; resize: vertical; padding: 12px 14px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1.4;
}
textarea:focus { border-color: var(--blush); outline: none; }

/* The worry meter: 0 to 100, calm to blush */
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.meter-val { font: 800 30px/1 var(--display); color: var(--blush); font-variant-numeric: tabular-nums; }
.meter-val.sm { font-size: 20px; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--calm), var(--blush));
}
input[type="range"]::-moz-range-track {
  height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--calm), var(--blush));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px; margin-top: -11px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--ink); box-shadow: var(--shadow);
}
input[type="range"]::-moz-range-thumb {
  width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink);
}
.meter-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* Theme list (questionnaire) */
.theme-q { padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.theme-q:last-child { border-bottom: 0; }

/* Ladder */
.ladder { display: flex; flex-direction: column; gap: 6px; }
.rung {
  display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
}
.rung.current { border-color: var(--blush); box-shadow: 0 0 0 2px var(--blush-soft); }
.rung.locked { opacity: .55; }
.rung-name { font-weight: 700; font-size: 14px; }
.dots { display: flex; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.dot.done { background: var(--blush); border-color: var(--blush); }
.dot.skip { background: var(--line); }
.rung-tick { font-size: 13px; font-weight: 700; color: var(--calm); }

/* Gap visual */
.gap { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blush); border-radius: 999px; }
.bar.calm > i { background: var(--calm); }
.gap-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.stat b { display: block; font: 800 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }

.badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.badge { border-radius: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.badge b { font-family: var(--display); }
.badge.got { border-color: var(--blush); background: var(--blush-soft); }
.badge:not(.got) { opacity: .5; }

.hist { display: flex; flex-direction: column; }
.hist-item { padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.hist-item:last-child { border-bottom: 0; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill.no { background: var(--calm-soft); color: var(--calm); }
.pill.partly, .pill.yes { background: var(--blush-soft); color: var(--blush); }
.pill.skipped { background: var(--line); color: var(--muted); }

.chart { width: 100%; height: 120px; display: block; }

.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: f; }
.facts li { background: var(--surface); border-radius: 14px; padding: 12px 14px 12px 46px; position: relative; box-shadow: var(--shadow); counter-increment: f; }
.facts li::before { content: counter(f); position: absolute; left: 14px; top: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--blush-soft); color: var(--blush); font-weight: 800; font-size: 13px; display: grid; place-items: center; }

.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }

.copybox { display: flex; gap: 8px; align-items: center; }
.copybox code { flex: 1; font: 700 18px/1.2 var(--body); user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; }
.copy { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }

.share-text { width: 100%; min-height: 260px; font-size: 14px; line-height: 1.45; }

.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row > div { min-width: 0; }
.toggle { width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: left .15s; }
.toggle[aria-pressed="true"] { background: var(--blush); }
.toggle[aria-pressed="true"]::after { left: 23px; }

.celebrate { text-align: center; align-items: center; padding-block: 24px; }
.medal {
  width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
  background: var(--blush-soft); color: var(--blush); font: 800 30px/1 var(--display);
  border: 4px solid var(--blush);
}

/* Tab bar */
.tabs {
  display: flex; border-top: 1px solid var(--line); background: var(--surface);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tab {
  flex: 1; min-height: 56px; border: 0; background: none; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--blush); }

/* SOS sheet */
.sheet-wrap { position: fixed; inset: 0; background: rgba(23, 17, 26, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet {
  width: 100%; max-width: 520px; max-height: 90%; overflow-y: auto;
  background: var(--bg); border-radius: 22px 22px 0 0;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.banner { font-size: 13px; padding: 8px 12px; border-radius: 12px; background: var(--sos-soft); color: var(--ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Slides: one question each */
.prog { display: flex; flex-direction: column; gap: 8px; }
.prog-row { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.back { background: none; border: 0; padding: 6px 0; color: var(--blush); font-weight: 700; font-size: 15px; cursor: pointer; }
.bar.thin { height: 6px; }
h2.question { font: 700 24px/1.25 var(--display); letter-spacing: -.01em; }
.actions .choices .choice { min-height: 56px; font-size: 16px; justify-content: center; text-align: center; }

/* Speak first: a big button that opens the keyboard so its microphone key is one tap away */
.speak-btn {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px;
  padding: 12px 16px; border-radius: 16px; border: 1.5px solid var(--blush);
  background: var(--blush-soft); color: var(--ink); text-align: left; cursor: pointer;
}
.speak-btn svg { width: 30px; height: 30px; flex: none; color: var(--blush); }
.speak-btn > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.speak-btn b { font-size: 17px; }
.speak-btn .small { color: var(--muted); line-height: 1.35; }

/* ---- Fit-the-screen layout: slides never scroll. Sizes scale with the screen height (dvh).
   Each rule gives a plain fallback first for older phones without dvh support. ---- */
html, body { overflow: hidden; }

.brand { font-size: 19px; }
.sos-btn { min-height: 32px; }

  position: static; background: none; margin-top: auto;
  padding-block: 10px 12px; padding-block: clamp(8px, 1.6dvh, 14px) clamp(10px, 2dvh, 16px);
  gap: 8px; gap: clamp(6px, 1.1dvh, 10px);
}
h1 { font-size: 24px; font-size: clamp(21px, 3.4dvh, 28px); }
h1.hero { font-size: 34px; font-size: clamp(30px, 6dvh, 44px); line-height: 1.05; }
h2.question { font-size: 21px; font-size: clamp(18px, 2.9dvh, 24px); line-height: 1.25; }
.lede { font-size: 16px; font-size: clamp(15px, 2.2dvh, 17px); }
.challenge-text { font-size: 19px; font-size: clamp(17px, 2.7dvh, 22px); }
.card { padding: 14px; padding: clamp(10px, 1.8dvh, 18px); gap: 8px; }
.btn { min-height: 50px; min-height: clamp(44px, 6.4dvh, 54px); }
.btn.ghost { min-height: 40px; }
.actions .choices { gap: 8px; gap: clamp(6px, 1dvh, 8px); }
.actions .choices .choice {
  min-height: 48px; min-height: clamp(40px, 6.2dvh, 56px);
  padding: 6px 12px; font-size: 16px; font-size: clamp(15px, 2.1dvh, 16px);
}
.prog { gap: 6px; }
.prog-row { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.prog-row .eyebrow { flex: 1; }
.back {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 22px; line-height: 1;
  display: grid; place-items: center; padding: 0 0 3px;
}
.speak-btn { min-height: 52px; min-height: clamp(48px, 7dvh, 64px); padding: 8px 14px; }

  display: flex; flex-direction: column; align-items: center; text-align: center;

.notes, .mini { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; gap: clamp(6px, 1.2dvh, 10px); font-size: 15px; }
.help-list { display: flex; flex-direction: column; gap: 6px; }

.navbtns { display: flex; gap: 6px; }
.nav {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; cursor: pointer;
}
.nav svg { width: 18px; height: 18px; }
.nav[disabled] { opacity: .3; cursor: default; }
.top .brand { flex: 1; }

<script>
/* Brave challenge bank, version 1 (Sun 18th October 2026).
   100 challenges: 10 bands (levels) x 10 feared-outcome themes, one per theme per band.
   Rules every item follows (from the Challenge Sources page in Notion):
   - harm nobody, minor social rule-breaks only, always legal
   - no deceiving workers, no filming, no touching, nobody who can't walk away
   - the goal is a behaviour, never a feeling
   Band 1 items take under a minute and involve no strangers.
   Sources for the harder bands: Fang, Sawyer, Asnaani and Hofmann 2013 (social mishap
   exposures), Dryden and Ellis 2001 (shame-attacking), Craske et al 2014, Jia Jiang's
   100 Days of Rejection. Bands 0 to 2 are original. */

window.BLUSH_BANK = (function () {
  var themes = [
    { key: 'looked', label: 'Being looked at', fear: 'people would stare at you', worry: 'People will stare at me and think I’m weird.' },
    { key: 'incompetent', label: 'Looking incompetent', fear: 'people would think you’re stupid', worry: 'They’ll think I’m stupid.' },
    { key: 'anxious', label: 'Looking nervous', fear: 'people would notice you’re nervous', worry: 'They’ll see I’m nervous and think less of me.' },
    { key: 'refused', label: 'Being refused', fear: 'someone would say no to you', worry: 'They’ll say no and I’ll feel stupid for asking.' },
    { key: 'laughed', label: 'Being laughed at', fear: 'someone would laugh at you', worry: 'Someone will laugh at me.' },
    { key: 'inconvenience', label: 'Being a bother', fear: 'someone would be annoyed with you', worry: 'They’ll be annoyed with me.' },
    { key: 'convention', label: 'Breaking a convention', fear: 'people would think you’re weird or rude', worry: 'People will think I’m strange or rude.' },
    { key: 'help', label: 'Asking for help', fear: 'people would think you’re useless', worry: 'They’ll think I’m useless or needy.' },
    { key: 'flaw', label: 'Showing a flaw', fear: 'people would think less of you', worry: 'They’ll think less of me.' },
    { key: 'rejected', label: 'Being turned down', fear: 'someone would turn you down', worry: 'They’ll turn me down and it’ll be awkward.' }
  ];

  A.fwd = function () { if (!fwd.length) return; collect(); hist.push(snap()); route = fwd.pop(); show(); };
  A.next = function (el) { collect(); if (el.dataset.done) A[el.dataset.done](el); else setStep((route.data.step || 0) + 1); };
  A.accept = function () { S.accepted = true; S.acceptedAt = today(); save(); go('safety', {}, true); };
  A['safety-submit'] = function () {
    var a = route.data.ans;
    var spin = [a.s0, a.s1, a.s2];
    var total = spin[0] + spin[1] + spin[2];
    var stop = a.phq > 0 || a.bully === 1 || a.psych === 1;
    S.safety = { date: today(), spin: spin, spinTotal: total, phq: a.phq, bully: a.bully === 1, psych: a.psych === 1, outcome: stop ? 'stop' : total >= B.miniSpin.cutoff ? 'high' : 'ok' };
    save();
    if (stop) go('stop', {}, true);
    else if (total >= B.miniSpin.cutoff) go('safety-high', {}, true);
    else A['after-safety']();
  };
  A['safety-redo'] = function () { go('safety', { recheck: !!S.profile }); };
  A['after-safety'] = function () { goHome(); };

  A.l0 = function (el) { go('l0-predict', { which: el.dataset.v }); };
  A['l0-go'] = function () { var d = route.data; go('l0-do', { which: d.which, worry: d.worry || B.level0[d.which].worry, p: d.ans.p }); };
  /* Focus inside the tap itself, so phones open the keyboard (and its microphone key) straight away */
  A.dictate = function (el) {
    var t = document.getElementById(el.dataset.for);
    if (!t) return;
    t.focus();
    try { t.setSelectionRange(t.value.length, t.value.length); } catch (e) { /* not all inputs support it */ }
  };
  A['l0-done'] = function () { go('l0-outcome', route.data); };
  A['l0-save'] = function () {
    var d = route.data;
    S.level0 = { date: today(), which: d.which, worry: d.worry, likelihood: d.p, outcome: d.ans.o };
    award('level0'); S.points += 10; markActive(); save();
    go('l0-done', {}, true);
  };

  A['themes-next'] = function () {
    var t = S.draft.themes || {};
    B.themes.forEach(function (th) { if (t[th.key] == null) t[th.key] = 50; });
    S.draft.themes = t; save(); go('p-picture');
  };
  A['picture-next'] = function () { S.draft.picture = val('pic'); save(); go('p-settings'); };
  A['settings-next'] = function () {
    var a = route.data.ans || {}, prev = S.draft.settings || [];
    S.draft.settings = B.settings.filter(function (s, i) {
      return a['pl' + i] != null ? a['pl' + i] === 1 : prev.indexOf(s.key) >= 0;
    }).map(function (s) { return s.key; });
    S.draft.settingsAsked = true;
    save(); go('p-bfne');
  };
  function bfneTotal(a) { var t = 0; for (var i = 0; i < 8; i++) t += a['f' + i] + 1; return t; }
  function bfneAnswers(a) { var r = []; for (var i = 0; i < 8; i++) r.push(a['f' + i] + 1); return r; }
  A['profile-finish'] = function () {
    var a = route.data.ans;
    S.profile = { themes: S.draft.themes || {}, picture: S.draft.picture || '', settings: S.draft.settings || [], date: today() };
    S.bfne.push({ date: today(), level: 0, answers: bfneAnswers(a), total: bfneTotal(a) });
    S.draft = {};
    if (!S.levels.length) buildLevel(1);
    save(); go('ladder-ready', {}, true);
  };
  A['bfne-save'] = function () {
    var a = route.data.ans;
    S.bfne.push({ date: today(), level: route.data.level, answers: bfneAnswers(a), total: bfneTotal(a) });
    save(); go('today', {}, true);
  };

  A['use-pic'] = function () { var t = document.getElementById('worry'); if (t && S.profile) t.value = S.profile.picture; };
  A['predict-save'] = function () {
    var d = route.data, a = d.ans || {}, lvl = curLevel(), id = d.itemId;
    S.active = { itemId: id, worry: d.worry || THEME[ITEM[id].theme].worry, likelihood: a.like != null ? a.like : 50, couldStand: a.stand || null, at: today(), encore: !!d.encore, level: d.encore ? 'encore' : (lvl ? lvl.n : 1) };
    markActive(); save(); go('do', {}, true);
  };
  function recordDone(wentBadly) {
    var a = S.active, it = ITEM[a.itemId];
    var e = { hid: 'h' + Date.now().toString(36), itemId: a.itemId, theme: it.theme, band: it.band, level: a.level, date: today(), worry: a.worry, likelihood: a.likelihood, couldStand: a.couldStand, status: 'done', outcome: null, howKnow: '', learned: '', wentBadly: !!wentBadly };
    S.history.push(e); S.active = null; S.points += 10; markActive();
    return e;
  }
  A['did-it'] = function () { if (!S.active) return go('today'); var e = recordDone(false); save(); go('debrief', { hid: e.hid }, true); };
  A['went-badly'] = function (el) {
    var e = el.dataset.hid ? entry(el.dataset.hid) : (S.active ? recordDone(true) : null);
    if (e) { e.wentBadly = true; if (S.flags.indexOf(e.itemId) < 0) S.flags.push(e.itemId); }
    save(); go('badly', { hid: e ? e.hid : null }, true);
  };
  A['debrief-save'] = function () {
    var d = route.data, e = entry(d.hid), o = d.ans.o;
    e.outcome = o; e.howKnow = d.know || ''; e.learned = d.learn || ''; e.debriefedAt = today();
    var pts = 5 + (o !== 'no' ? 5 : 0);
    S.points += pts;
    if (o !== 'no') award('stillhere');
    markActive(); save();
    go('result', { hid: e.hid, pts: pts + 10 }, true);
  };
  A['close-it'] = function () {
    var lvl = curLevel();
    if (lvl && levelComplete(lvl)) {
      lvl.done = true; lvl.completedAt = today();
      award('level' + lvl.n);
      S.summaryFor = lvl.n;
      if (lvl.n === 10) S.finished = true;
      save(); go('level-summary', {}, true);
    } else go('today', {}, true);
  };
  A.extra = function () {
    var n = S.summaryFor, lvl = S.levels[n - 1];
    var ids = pickItems(n, 1, { avoidThemes: lvl.items.map(function (id) { return ITEM[id].theme; }) });
    if (ids.length) { lvl.items.push(ids[0]); lvl.done = false; lvl.extraUsed = true; }
    S.summaryFor = null; save(); go('today', {}, true);
  };
  A['level-next'] = function () {
    var n = S.summaryFor;
    S.summaryFor = null;
    if (n < 10 && !S.levels[n]) buildLevel(n + 1);
    save(); go('today', {}, true);
  };
  A['skip-save'] = function () {
    var id = route.data.itemId, it = ITEM[id], reason = route.data.ans.r;
    var lvl = curLevel();
    S.history.push({ hid: 'h' + Date.now().toString(36), itemId: id, theme: it.theme, band: it.band, level: lvl ? lvl.n : 1, date: today(), status: 'skipped', skipReason: reason });
    if (reason === 'unsafe' && S.flags.indexOf(id) < 0) S.flags.push(id);
    if (S.active && S.active.itemId === id) S.active = null;
    var band = reason === 'too-much' ? Math.max(1, it.band - 1) : it.band;
    var others = lvl ? lvl.items.filter(function (x) { return x !== id; }).map(function (x) { return ITEM[x].theme; }) : [];
    var rep = pickItems(band, 1, { avoidThemes: others.concat([it.theme]) })[0];
    if (lvl && rep) { lvl.items[lvl.items.indexOf(id)] = rep; }
    save();
    if (rep) go('reveal', { itemId: rep, swapped: true }, true); else go('today', {}, true);
  };
  A.encore = function () {
    var done = S.history.filter(function (h) { return h.status === 'done' && h.level !== 'encore' && !h.wentBadly; });
    if (!done.length) return;
    var pick = done[Math.floor(Math.random() * done.length)];
    go('reveal', { itemId: pick.itemId, encore: true });
  };
  A.pause = function () { if (!S.paused) S.paused = today(); sosOpen = false; save(); go('today', {}, true); };
  A.resume = function () {
    if (S.paused) { var to = addDays(today(), -1); if (to >= S.paused) S.pauses.push({ from: S.paused, to: to }); S.paused = null; }
    save(); if (route.name === 'settings') render(); else go('today', {}, true);
  };
  A['test-mode'] = function () { S.testMode = !S.testMode; save(); render(); };
  A['delete-ask'] = function () { route.data.confirmDel = true; render(); };
  A['delete-all'] = function () {
    try { localStorage.removeItem(KEY); } catch (e) { /* nothing to remove */ }
    S = fresh(); go('welcome', {}, true);
  };
  A.sos = function () { sosOpen = true; render(); };
  A['sos-close'] = function (el, ev) { if (ev && ev.target.closest('[data-stop]') && el.classList.contains('sheet-wrap')) return; sosOpen = false; render(); };
  function copyText(text, btn, fallbackEl) {
    var done = function () { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); };
    var fail = function () { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } btn.textContent = 'Select and copy'; };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }
  A.copy = function (el) { copyText(el.dataset.text, el, null); };
  A['copy-list'] = function (el) { var t = document.getElementById('mylist'); copyText(t.value, el, t); };
  A['copy-share'] = function (el) { var t = document.getElementById('share'); copyText(t.value, el, t); };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el) return;
    if (el.classList.contains('sheet-wrap') && ev.target.closest('.sheet')) return;
    var fn = A[el.dataset.a];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.type === 'range') { var o = document.querySelector('[data-out="' + t.id + '"]'); if (o) o.textContent = t.value + '%'; }
  });

  goHome();
})();

</script>
</body>
</html>
